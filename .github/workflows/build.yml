name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse build matrix
        id: set-matrix
        run: |
          sudo pip3 install yq
          MATRIX=$(yq -o=json -I=0 '{"include": .include}' build.yaml)
          echo "build_matrix=${MATRIX}" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    runs-on: ubuntu-22.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: |
          SHIELD="${{ matrix.shield }}"
          BOARD="${{ matrix.board }}"
          SNIPPET="${{ matrix.snippet }}"
          CMAKE_ARGS="${{ matrix.cmake-args }}"
          ARTIFACT_NAME="${SHIELD:-${BOARD}}"
          DISPLAY_NAME="${SHIELD:-${BOARD}}"
          if [ -n "${SHIELD}" ]; then
            DISPLAY_NAME="${SHIELD} (${BOARD})"
          fi
          EXTRA_CONF=""
          if [ -f "zephyr/module.yml" ]; then
            EXTRA_CONF="-DZMK_EXTRA_MODULES=\"\${GITHUB_WORKSPACE}/zephyr\""
          fi
          BUILD_ARGS=""
          if [ -n "${SHIELD}" ]; then
            BUILD_ARGS="${BUILD_ARGS} -DSHIELD=${SHIELD}"
          fi
          if [ -n "${SNIPPET}" ]; then
            BUILD_ARGS="${BUILD_ARGS} -S ${SNIPPET}"
          fi
          if [ -n "${CMAKE_ARGS}" ]; then
            BUILD_ARGS="${BUILD_ARGS} ${CMAKE_ARGS}"
          fi
          echo "shield=${SHIELD}" >> $GITHUB_OUTPUT
          echo "board=${BOARD}" >> $GITHUB_OUTPUT
          echo "snippet=${SNIPPET}" >> $GITHUB_OUTPUT
          echo "cmake_args=${CMAKE_ARGS}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "display_name=${DISPLAY_NAME}" >> $GITHUB_OUTPUT
          echo "extra_conf=${EXTRA_CONF}" >> $GITHUB_OUTPUT
          echo "build_args=${BUILD_ARGS}" >> $GITHUB_OUTPUT

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            bootloader/
          key: west-modules-${{ hashFiles('config/west.yml', 'build.yaml') }}

      - name: West Init
        run: |
          west init -l config
          west config --local build.board ${{ steps.vars.outputs.board }}
          west update --narrow -o=--depth=1

      - name: West Zephyr export
        run: west zephyr-export

      - name: West Build (${{ steps.vars.outputs.display_name }})
        run: |
          west build -s zmk/app -b ${{ steps.vars.outputs.board }} \
            ${{ steps.vars.outputs.build_args }} \
            ${{ steps.vars.outputs.extra_conf }}

      - name: Kconfig file
        if: ${{ !cancelled() }}
        run: cat build/zephyr/.config 2>/dev/null || echo "No .config found"

      - name: Devicetree file
        if: ${{ !cancelled() }}
        run: cat build/zephyr/zephyr.dts 2>/dev/null || cat build/zephyr/zephyr.dts.pre 2>/dev/null || echo "No devicetree found"

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 artifacts/${{ steps.vars.outputs.artifact_name }}.uf2
          elif [ -f build/zephyr/zmk.bin ]; then
            cp build/zephyr/zmk.bin artifacts/${{ steps.vars.outputs.artifact_name }}.bin
          elif [ -f build/zephyr/zmk.hex ]; then
            cp build/zephyr/zmk.hex artifacts/${{ steps.vars.outputs.artifact_name }}.hex
          fi

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ steps.vars.outputs.artifact_name }}
          path: artifacts/

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
