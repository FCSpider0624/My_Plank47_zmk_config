# This file was generated from a template. Edit it to match your keyboard.
# See https://zmk.dev/docs/development/hardware-integration/new-shield for more
# instructions.

# This file will be copied into the user's config directory when they add this
# keyboard. Define any Kconfig options users may frequently want to set here,
# but leave them commented out, for example:

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Enable common-anode RGB status LED via zmk-rgbled-widget
# See https://github.com/caksoylar/zmk-rgbled-widget
CONFIG_ZMK_USB=y
# Mouse emulation (scroll wheel / mouse buttons), off by default in ZMK v0.3
CONFIG_ZMK_POINTING=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_RGBLED_WIDGET=y
# Layer indicator: constant color per layer (mutually exclusive with SHOW_LAYER_CHANGE)
# Colors: 0=black 1=red 2=green 3=yellow 4=blue 5=magenta 6=cyan 7=white
# Status LED colors (blinking): BLE connected=blue, advertising=yellow, disconnected=red,
#   USB=cyan, battery high=green, medium=yellow, low/critical=red, missing=magenta
# Layer colors are solid (non-blinking) and avoid the common status colors
#   blue/green/yellow/red; only white/magenta/cyan are used.
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0   # base layer: off
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=7   # white
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=5   # magenta
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6   # cyan
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=7   # white
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=5   # magenta
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=6   # cyan
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=7   # white
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=5   # magenta
CONFIG_RGBLED_WIDGET_LAYER_9_COLOR=6   # cyan
CONFIG_RGBLED_WIDGET_LAYER_10_COLOR=7  # white
CONFIG_RGBLED_WIDGET_LAYER_11_COLOR=5  # magenta
CONFIG_RGBLED_WIDGET_LAYER_12_COLOR=6  # cyan
CONFIG_RGBLED_WIDGET_LAYER_13_COLOR=7  # white
CONFIG_RGBLED_WIDGET_LAYER_14_COLOR=5  # magenta
CONFIG_RGBLED_WIDGET_LAYER_15_COLOR=6  # cyan
  
